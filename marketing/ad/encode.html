<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Encode</title></head>
<body>
<script type="module">
  // Turns frames/0000.jpg … into an H.264 MP4 with WebCodecs and mp4-muxer; returns it as base64.
  import { Muxer, ArrayBufferTarget } from '/ad/node_modules/mp4-muxer/build/mp4-muxer.mjs';

  window.encode = async (total, fps, width, height) => {
    const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: 'avc', width, height, frameRate: fps }, fastStart: 'in-memory' });
    let failure = null;
    const encoder = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => (failure = e) });
    encoder.configure({ codec: 'avc1.640033', width, height, bitrate: Number(new URLSearchParams(location.search).get('bitrate') || 4_200_000), framerate: fps, avc: { format: 'avc' } });
    for (let f = 0; f < total; f++) {
      const blob = await (await fetch(`/ad/frames/${String(f).padStart(4, '0')}.jpg`)).blob();
      const bitmap = await createImageBitmap(blob);
      const frame = new VideoFrame(bitmap, { timestamp: Math.round((f * 1e6) / fps), duration: Math.round(1e6 / fps) });
      encoder.encode(frame, { keyFrame: f % (fps * 2) === 0 });
      frame.close();
      bitmap.close();
      while (encoder.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 5));
      if (failure) throw failure;
    }
    await encoder.flush();
    muxer.finalize();
    const bytes = new Uint8Array(muxer.target.buffer);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  };
</script>
</body>
</html>
