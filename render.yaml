# Render blueprint for Kabuor Builds: one Docker web service that serves the company site, the Kabuor Shops pages
# and every shop, with a persistent disk for the shops' databases, photos and the nightly backups.
# Render → New → Blueprint → this repository. It asks for the values marked sync: false.
services:
  - type: web
    name: kabuor-builds
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # a disk needs a paid instance; it also stays awake (free ones sleep)
    region: frankfurt      # Render's closest region to Kenya
    healthCheckPath: /api/health
    autoDeploy: true       # every push to main deploys
    disk:
      name: data
      mountPath: /data     # survives deploys and restarts; Render snapshots it daily
      sizeGB: 5
    envVars:
      - key: DATA_DIR      # every shop's database and uploads, platform.db and backups/
        value: /data
      - key: TRUST_PROXY   # behind Render's proxy: real client IPs for rate limits, https detected
        value: "1"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET    # signs every shop's admin sessions; changing it signs everyone out
        generateValue: true
      - key: PUBLIC_URL    # the platform's https address, for M-Pesa callbacks; set once the domain is attached
        sync: false        # e.g. https://builds.kabuor-technologies.company (until then the onrender.com address is used)
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD # the platform dashboard at /admin
        sync: false
      - key: COMPANY_SITE_ORIGINS
        value: https://www.kabuor-technologies.company,https://kabuor-technologies.company
      # Optional, add when ready (Render → Environment):
      #   PLATFORM_MPESA_ENV=production, PLATFORM_MPESA_CONSUMER_KEY, _CONSUMER_SECRET, _SHORTCODE, _PASSKEY, _TILL
      #   AT_USERNAME, AT_API_KEY, AT_SENDER_ID (SMS order alerts)
      #   PLATFORM_DOMAIN (only with wildcard DNS for <link>.<domain> shop links)
